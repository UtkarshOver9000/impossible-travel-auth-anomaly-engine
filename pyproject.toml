[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ittravel"
version = "0.1.0"
description = "Impossible travel auth anomaly engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
